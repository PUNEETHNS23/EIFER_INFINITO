services:
  - type: web
    name: placeholdername
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://eifer-frontend.vercel.app,http://localhost:5173,http://localhost:3000
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      - key: CORS_ALLOW_CREDENTIALS
        value: "false"
